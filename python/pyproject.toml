[project]
name = "flux"
version = "0.1.0"
description = "Python port of flux game step + NN forward pass, bit-exact parity with JS reference."
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "mlx>=0.20",
    "wandb>=0.18",
    "pandas>=3.0.3",
    "pillow>=12.2.0",
    "numba>=0.65.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["flux"]
